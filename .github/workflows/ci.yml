name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
        if: runner.os != 'Linux'
      - run: xvfb-run --auto-servernum pnpm test:e2e
        if: runner.os == 'Linux'
      - run: pnpm make --arch=${{ matrix.arch }}
      - run: pnpm verify:package
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}-${{ matrix.arch }}
          path: out/make/**
          if-no-files-found: error
