version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      desktop-runtime:
        patterns: [electron, '@electron-forge/*', '@electron/fuses', update-electron-app]
        update-types: [minor, patch]
      nuxt:
        patterns: [nuxt, vue, '@vue/*', '@vueuse/*', '@nuxtjs/*', '@unocss/*', unocss]
        update-types: [minor, patch]
    ignore:
      # vue-tsc currently depends on the TypeScript 6 compiler API.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
