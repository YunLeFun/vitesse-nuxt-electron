minimumReleaseAgeExcludePrune: true

# Electron Forge requires hoisted production dependencies.
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - '@vue/compiler-core@3.5.44'
  - '@vue/compiler-dom@3.5.44'
  - '@vue/compiler-sfc@3.5.44'
  - '@vue/compiler-ssr@3.5.44'
  - '@vue/reactivity@3.5.44'
  - '@vue/runtime-core@3.5.44'
  - '@vue/runtime-dom@3.5.44'
  - '@vue/server-renderer@3.5.44'
  - '@vue/shared@3.5.44'
  - vitest@5.0.4
  - vue@3.5.44

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
nodeLinker: hoisted
shellEmulator: true
verifyDepsBeforeRun: error

allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  unrs-resolver: true
